spring.application.name=clipflow-server
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/clipflow}
spring.datasource.username=${DB_USER:clipflow}
spring.datasource.password=${DB_PASSWORD:clipflow_dev}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
spring.jackson.time-zone=UTC
