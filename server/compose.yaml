services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: clipflow
      POSTGRES_USER: clipflow
      POSTGRES_PASSWORD: clipflow_dev
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clipflow -d clipflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    environment:
      DB_URL: jdbc:postgresql://db:5432/clipflow
      DB_USER: clipflow
      DB_PASSWORD: clipflow_dev
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
